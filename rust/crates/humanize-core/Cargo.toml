[package]
name = "humanize-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Deterministic prose rewriting engine: transforms text toward a target reading level and away from machine-writing patterns."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"
